<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #1f2937;
      line-height: 1.5;
    }
    header {
      background: #111827;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a { color: #d1d5db; text-decoration: none; font-weight: 600; }
    header a:hover { color: white; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0; font-size: 20px; }
    h2 { font-size: 18px; margin: 20px 0 10px; color: #111827; }
    h3 { font-size: 15px; color: #374151; margin: 14px 0 6px; }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-gray { background: #e5e7eb; color: #374151; }
    .badge-red { background: #fee2e2; color: #991b1b; }

    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f9fafb; font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover td { background: #fafafa; }

    .score { font-size: 18px; font-weight: 700; }
    .score-90 { color: #15803d; }
    .score-75 { color: #ca8a04; }
    .score-low { color: #6b7280; }

    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 6px;
      background: #1f2937;
      color: white !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #111827; }
    .btn-primary { background: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: white; color: #1f2937 !important; border: 1px solid #d1d5db; }
    .btn-secondary:hover { background: #f3f4f6; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }

    .filters { background: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e5e7eb; }
    .filters label { font-size: 13px; color: #6b7280; margin-right: 8px; }
    .filters input, .filters select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }

    .subscores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
    .subscore-cell { background: #f9fafb; padding: 8px; border-radius: 6px; text-align: center; }
    .subscore-cell .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; }
    .subscore-cell .val { font-size: 18px; font-weight: 700; color: #111827; }

    ul.bullets { padding-left: 18px; margin: 6px 0; }
    ul.bullets li { margin: 3px 0; }

    .keyword { display: inline-block; background: #ede9fe; color: #5b21b6; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px 4px 2px 0; }

    pre.jd { background: #f9fafb; padding: 12px; border-radius: 6px; max-height: 400px; overflow: auto; white-space: pre-wrap; font-family: inherit; font-size: 13px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .connector { background: #eff6ff; padding: 12px; border-left: 3px solid #2563eb; border-radius: 4px; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>🎯 JobHunter</h1>
    <nav>
      <a href="/">岗位列表</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
