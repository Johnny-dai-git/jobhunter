<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <style>
    /* ============ Reset & Base ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.55;
      font-size: 14px;
    }

    /* ============ Tokens ============ */
    :root {
      --color-bg: #f8fafc;
      --color-card: #ffffff;
      --color-border: #e2e8f0;
      --color-border-strong: #cbd5e1;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-text-dim: #94a3b8;
      --color-accent: #4f46e5;
      --color-accent-hover: #4338ca;
      --color-accent-light: #eef2ff;
      --color-success: #16a34a;
      --color-success-light: #dcfce7;
      --color-warn: #ca8a04;
      --color-warn-light: #fef3c7;
      --color-danger: #dc2626;
      --color-danger-light: #fee2e2;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.07), 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    }

    /* ============ Header ============ */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }
    header nav a:hover { color: white; background: rgba(255,255,255,0.06); }

    main {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 24px;
    }

    h2 { font-size: 17px; margin: 24px 0 12px; font-weight: 700; letter-spacing: -0.01em; }
    h3 {
      font-size: 12px;
      color: var(--color-text-muted);
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    h3:first-child { margin-top: 0; }

    /* ============ Card ============ */
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card-flat { padding: 0; overflow: hidden; }

    /* ============ Badges ============ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge-green { background: var(--color-success-light); color: #14532d; }
    .badge-yellow { background: var(--color-warn-light); color: #713f12; }
    .badge-gray { background: #f1f5f9; color: #334155; }
    .badge-red { background: var(--color-danger-light); color: #7f1d1d; }
    .badge-indigo { background: var(--color-accent-light); color: var(--color-accent); }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }

    /* ============ Table ============ */
    table { border-collapse: collapse; width: 100%; }
    th, td {
      padding: 14px 16px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--color-border);
    }
    th {
      background: #f8fafc;
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      position: sticky;
      top: 0;
    }
    tr:hover td { background: #f8fafc; }
    tr:last-child td { border-bottom: none; }

    /* ============ Score ============ */
    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .score-90 { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); color: #14532d; }
    .score-75 { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); color: #713f12; }
    .score-low { background: #f1f5f9; color: #64748b; }

    /* ============ Buttons ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--color-text);
      color: white !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1.3;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-primary { background: var(--color-accent); }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-secondary {
      background: white;
      color: var(--color-text) !important;
      border-color: var(--color-border-strong);
    }
    .btn-secondary:hover { background: #f8fafc; color: var(--color-text) !important; }
    .btn-success { background: var(--color-success); }
    .btn-success:hover { background: #15803d; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ============ Filters ============ */
    .filters {
      background: var(--color-card);
      padding: 16px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 12px;
      color: var(--color-text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filters input, .filters select {
      padding: 7px 12px;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: white;
      color: var(--color-text);
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .filters input:focus, .filters select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-light);
    }
    .filters input[type="number"] { width: 80px; cursor: text; }
    .filters-count {
      margin-left: auto;
      color: var(--color-text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    /* ============ Job title link ============ */
    .job-title {
      font-weight: 600;
      color: var(--color-text);
      text-decoration: none;
      letter-spacing: -0.005em;
    }
    .job-title:hover { color: var(--color-accent); }
    .job-summary { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; line-height: 1.45; }

    /* ============ Job detail hero ============ */
    .hero {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .hero-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
    .hero-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--color-text-muted);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .hero-meta-sep { color: var(--color-border-strong); }
    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ============ Subscores ============ */
    .score-big {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--color-text);
    }
    .score-big-label {
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .subscores {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .subscore-cell {
      background: #f8fafc;
      padding: 12px;
      border-radius: var(--radius-sm);
      text-align: center;
      border: 1px solid var(--color-border);
    }
    .subscore-cell .label {
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subscore-cell .val {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }
    .subscore-cell .val small {
      font-size: 11px;
      color: var(--color-text-dim);
      font-weight: 500;
      margin-left: 2px;
    }

    /* ============ Other detail elements ============ */
    .connector {
      background: var(--color-accent-light);
      padding: 14px 16px;
      border-left: 3px solid var(--color-accent);
      border-radius: var(--radius-sm);
      font-style: italic;
      color: #1e1b4b;
    }
    ul.bullets { padding-left: 20px; margin: 4px 0; }
    ul.bullets li { margin: 4px 0; }
    .keyword {
      display: inline-flex;
      background: #f5f3ff;
      color: #5b21b6;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      margin: 2px 4px 2px 0;
    }
    pre.jd {
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      border-radius: var(--radius-sm);
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0; align-items: center; }

    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--color-text-muted);
      text-decoration: none; margin-bottom: 12px; font-weight: 500;
    }
    .back-link:hover { color: var(--color-accent); }

    /* ============ Empty state ============ */
    .empty {
      text-align: center;
      color: var(--color-text-muted);
      padding: 60px 30px;
      font-size: 14px;
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>
  <header>
    <a href="/onboarding" style="color:white; text-decoration:none;"><h1>🎯 JobHunter</h1></a>
    <nav>
      <a href="/onboarding">首页 / 画像</a>
      <a href="/jobs">所有岗位</a>
      <a href="/applied">已投递</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
