# ====== LLM Provider 配置 ======
# DeepSeek V4 提供 Anthropic 兼容接口,所以两家可以共用 anthropic SDK,只换 base_url + api_key
providers:
  claude:
    # base_url 留空表示用 anthropic SDK 默认值
    base_url: ""
    api_key_env: ANTHROPIC_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY

# ====== 模型路由 ======
# 当前: 全 DeepSeek 路由 (无需 Anthropic key)
# - 高频任务 (matcher): v4-flash, 便宜快
# - 质量任务 (tailor / cover_letter / apply / trends): v4-pro, 1M context, 强 tool_use
model:
  # DeepSeek 实际可用模型: deepseek-chat (通用,支持 tool_use) / deepseek-reasoner (推理)
  matcher:
    provider: deepseek
    name: deepseek-v4-flash
  tailor:
    provider: claude
    name: claude-opus-4-6
  cover_letter:
    provider: claude
    name: claude-opus-4-6
  trends:
    provider: deepseek
    name: deepseek-v4-flash
  profile_analyzer:
    provider: deepseek
    name: deepseek-v4-flash
  max_tokens: 4096

# ====== 求职偏好 ======
preferences:
  # 目标岗位关键词(LinkedIn 搜索能识别的标准表述)
  # 根据简历 AI Infrastructure / ML Systems / eBPF / LLM Serving 背景
  job_titles:
    - Machine Learning Engineer
    - ML Infrastructure Engineer
    - AI Engineer
    - Software Engineer Machine Learning

  # 目标地点 (用 LinkedIn 能识别的标准写法)
  # LinkedIn 用 "United States" 全覆盖即可, 不需要分城市搜
  locations:
    - United States

  # 工作类型 (可多选，LinkedIn 采集时作为过滤条件传给 Apify)
  # 支持: Full-time, Part-time, Contract, Internship, Temporary, Volunteer
  job_types:
    - Full-time
    # - Internship
    # - Contract
    # - Part-time

  # 公司规模偏好(用于匹配评分加权)
  company_size:
    - Startup
    - Mid-size
    - Large

  # 技术栈关键词(出现得越多,匹配度越高)
  must_have_skills:
    - Python

  nice_to_have_skills:
    - PyTorch
    - Kubernetes
    - LLM
    - NCCL
    - eBPF
    - vLLM
    - CUDA

  # 排除关键词(出现就跳过,采集时即过滤,省 LLM 调用费)
  # 借鉴 DailyJobMatch: 在评分前就剔除明显不符合的
  exclude_keywords:
    - Senior Director
    - VP
    - temporary
    - postdoc

  # 经验年限范围(用于过滤明显不匹配的)
  years_of_experience:
    min: 0
    max: 8

  # 薪资下限(USD/年,可选)
  min_salary_usd: 80000

# ====== 匹配评分阈值 ======
scoring:
  # 低于此分数的岗位不会推荐生成简历
  min_recommend_score: 70
  # 低于此分数的岗位会被自动归档
  auto_archive_below: 40

# ====== 抓取时间窗 ======
freshness:
  # 只抓最近多少小时内发布的岗位 (0 = 不限制)
  max_age_hours: 24

# ====== 每日邮件 digest ======
digest:
  enabled: true
  top_n: 15
  # 收件邮箱
  to: yxd429@case.edu
  # SMTP
  smtp:
    host: smtp.gmail.com
    port: 587
    username: pittsburghdaidai@gmail.com
    # 应用专用密码 (Gmail 需要),从 .env 里读 SMTP_PASSWORD
    password_env: SMTP_PASSWORD

# 注: job-agent 不自动投递. 你看完邮件,在网站上手动投完,跑 `mark-applied --job-id N` 记录即可.

# ====== Apify (第三方爬虫即服务,反爬由他们维护) ======
apify:
  api_token_env: APIFY_API_TOKEN
  default_timeout_sec: 600        # 等待 Actor 跑完的最大秒数

# ====== 采集器 ======
# 每个平台可单独配 backend: apify (用 Apify Actor) 或 playwright (自己爬)
collectors:
  linkedin:
    enabled: true
    backend: apify                # apify | playwright
    apify:
      # 当前用 harvestapi: $1 per 1000 jobs, 无需登录, 无月费
      # https://apify.com/harvestapi/linkedin-job-search
      actor: harvestapi/linkedin-job-search
      input_overrides: {}         # 可以追加 actor 自定义 input
    cookie_file: data/cookies/linkedin.json    # 仅 backend=playwright 时用
    # Per-title 搜索策略: 每个 title 单独一次 Apify 调用
    results_per_title: 15         # 每个 title 返回多少条 (~$0.015/title)
    max_titles: 40                # 最多搜索多少个 title (primary + aliases + broader_terms)
    max_per_run: 400              # 跨所有 title 的全局去重上限 (40×15=600原始, 去重后约400)
    # 费用估算: 40 titles × 15条 = 600条原始 ≈ $0.60/次

  indeed:
    enabled: true
    backend: apify
    apify:
      actor: misceres/indeed-scraper      # $5/1000 = $0.005/岗位
      input_overrides: {}
    cookie_file: data/cookies/indeed.json  # 仅 backend=playwright 时用
    results_per_url: 15                    # 每个 keyword-location URL 返回多少条
    max_per_run: 400                       # 全局去重上限 (40 keywords × 15 = 600原始, 去重后约400)
    # 费用估算: 40 keywords × 15条 = 600条原始 ≈ $3.00/次 (misceres $5/1000)

  glassdoor:
    # 禁用: Apify 上无便宜可用的 jobs scraper (都偏评论/薪资类)
    enabled: false
    backend: playwright
    cookie_file: data/cookies/glassdoor.json
    max_per_run: 20

  ziprecruiter:
    # 暂禁用: ZipRecruiter 用 Cloudflare Bot Fight 防爬,Playwright+cookies 也过不去.
    enabled: false
    backend: playwright
    cookie_file: data/cookies/ziprecruiter.json
    max_per_run: 30

  # ====== 创业公司专门库 ======
  yc:
    enabled: true
    backend: apify
    apify:
      actor: artemlazarevm/yc-jobs-scraper       # YC startup jobs
      input_overrides: {}
    max_per_run: 15

  wellfound:
    # 禁用: 主流 actor (clearpath / mscraper / radeance) 都要月租 $7-30
    enabled: false
    backend: apify
    apify:
      actor: radeance/wellfound-job-listings-scraper
      input_overrides: {}
    max_per_run: 15

  # ====== 美国传统科技岗位库 ======
  dice:
    enabled: true
    backend: apify
    apify:
      # scrapestorm/dice-jobs-scraper-fast-cheap 不存在, 换 worldunboxer (有清晰 schema)
      actor: worldunboxer/dice-jobs-scraper
      input_overrides: {}
    max_per_run: 15

  # ====== HackerNews 社区招聘帖 ======
  hackernews:
    # 直连 HN Firebase + Algolia API,完全免费,不需要 Apify
    enabled: true
    backend: api
    max_per_run: 30

# ====== 路径 ======
paths:
  resume_dir: data/resume          # 简历库: 存放不同版本的简历文件
  materials_dir: data/materials    # 资料库: 文章、论文、项目说明等个人背景材料
  jobs_dir: data/jobs
  outputs_dir: data/outputs
  db_path: data/jobs.db
