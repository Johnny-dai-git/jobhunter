# ====== LLM Provider 配置 ======
# DeepSeek V4 提供 Anthropic 兼容接口,所以两家可以共用 anthropic SDK,只换 base_url + api_key
providers:
  claude:
    # base_url 留空表示用 anthropic SDK 默认值
    base_url: ""
    api_key_env: ANTHROPIC_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY

# ====== 模型路由 ======
# 当前: 全 DeepSeek 路由 (无需 Anthropic key)
# - 高频任务 (matcher): v4-flash, 便宜快
# - 质量任务 (tailor / cover_letter / apply / trends): v4-pro, 1M context, 强 tool_use
model:
  # DeepSeek 实际可用模型: deepseek-chat (通用,支持 tool_use) / deepseek-reasoner (推理)
  matcher:
    provider: deepseek
    name: deepseek-chat
  tailor:
    provider: deepseek
    name: deepseek-chat
  cover_letter:
    provider: deepseek
    name: deepseek-chat
  trends:
    provider: deepseek
    name: deepseek-chat
  max_tokens: 4096

# ====== 求职偏好 ======
preferences:
  # 目标岗位关键词(用于搜索和过滤)
  # 根据简历(AI Infrastructure / ML Systems / LLM Serving / eBPF) 设置
  job_titles:
    - AI Infrastructure Engineer
    - Machine Learning Systems Engineer
    - LLM Infrastructure Engineer
    - ML Platform Engineer
    - Distributed Systems Engineer

  # 目标地点
  locations:
    - Remote
    - San Francisco Bay Area
    - New York
    - Seattle

  # 工作类型
  job_types:
    - Full-time
    # - Internship
    # - Contract

  # 公司规模偏好(用于匹配评分加权)
  company_size:
    - Startup
    - Mid-size
    - Large

  # 技术栈关键词(出现得越多,匹配度越高)
  must_have_skills:
    - Python

  nice_to_have_skills:
    - PyTorch
    - Kubernetes
    - LLM
    - NCCL
    - eBPF
    - vLLM
    - CUDA

  # 排除关键词(出现就跳过,采集时即过滤,省 LLM 调用费)
  # 借鉴 DailyJobMatch: 在评分前就剔除明显不符合的
  exclude_keywords:
    - Senior Director
    - VP
    - intern
    - internship
    - student
    - temporary
    - contractor only
    - postdoc

  # 经验年限范围(用于过滤明显不匹配的)
  years_of_experience:
    min: 0
    max: 8

  # 薪资下限(USD/年,可选)
  min_salary_usd: 80000

# ====== 匹配评分阈值 ======
scoring:
  # 低于此分数的岗位不会推荐生成简历
  min_recommend_score: 70
  # 低于此分数的岗位会被自动归档
  auto_archive_below: 40

# ====== 抓取时间窗 ======
freshness:
  # 只抓最近多少小时内发布的岗位 (0 = 不限制)
  max_age_hours: 24

# ====== 每日邮件 digest ======
digest:
  enabled: true
  top_n: 15
  # 收件邮箱
  to: ""
  # SMTP (可选,留空则只生成 HTML 文件不发邮件)
  smtp:
    host: smtp.gmail.com
    port: 587
    username: ""
    # 应用专用密码 (Gmail 需要),建议放在 .env 里读
    password_env: SMTP_PASSWORD

# 注: job-agent 不自动投递. 你看完邮件,在网站上手动投完,跑 `mark-applied --job-id N` 记录即可.

# ====== Apify (第三方爬虫即服务,反爬由他们维护) ======
apify:
  api_token_env: APIFY_API_TOKEN
  default_timeout_sec: 600        # 等待 Actor 跑完的最大秒数

# ====== 采集器 ======
# 每个平台可单独配 backend: apify (用 Apify Actor) 或 playwright (自己爬)
collectors:
  linkedin:
    enabled: true
    backend: apify                # apify | playwright
    apify:
      actor: bebity/linkedin-jobs-scraper      # https://apify.com/bebity/linkedin-jobs-scraper
      # 可以追加任意 actor 自定义 input;_build_input() 会做基础默认
      input_overrides: {}
    cookie_file: data/cookies/linkedin.json    # 仅 backend=playwright 时用
    max_per_run: 30

  indeed:
    enabled: true
    backend: playwright           # 想切 apify 见下面注释
    # backend: apify
    # apify:
    #   actor: misceres/indeed-scraper
    cookie_file: data/cookies/indeed.json
    max_per_run: 30

  glassdoor:
    enabled: true
    backend: playwright
    cookie_file: data/cookies/glassdoor.json
    max_per_run: 20

  ziprecruiter:
    enabled: true
    backend: playwright
    cookie_file: data/cookies/ziprecruiter.json
    max_per_run: 30

# ====== 路径 ======
paths:
  resume_dir: data/resume
  jobs_dir: data/jobs
  outputs_dir: data/outputs
  db_path: data/jobs.db
